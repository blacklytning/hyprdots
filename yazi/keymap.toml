[[input.prepend_keymap]]
on   = "<Esc>"
run  = "close"
desc = "Cancel input"

[[mgr.prepend_keymap]]
on  = "<C-n>"
run = "shell -- dragon-drop -x -i -T %h"

[[mgr.prepend_keymap]]
on = "y"
run = [
    '''shell -- for path in %s; do
        case "$path" in
            *.png|*.PNG|*.jpg|*.JPG|*.jpeg|*.JPEG|*.webp|*.WEBP)
                wl-copy --type image/png < "$path"
                ;;
            *)
                echo "file://$path" | wl-copy -t text/uri-list
                ;;
        esac
    done''',
    "yank"
]

[[mgr.prepend_keymap]]
on   = [ "g", "l" ]
run  = "plugin open-git-remote"
desc = "open git remote url"
