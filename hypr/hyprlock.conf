general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
}

background {
    monitor =
    path = screenshot
    color = rgba(0, 0, 0, 0)
    blur_passes = 2
    blur_size = 4
}

label {
    text = cmd[update:1000] echo "$TIME"
    color = rgba(200, 200, 200, 1.0)
    font_size = 80
    position = 0, 0
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 2
}

label {
    text = $USER
    color = rgba(200, 200, 200, 1.0)
    font_size = 30
    position = 0, 90
    halign = center
    valign = center
    shadow_passes = 1
}

input-field {
    size = 260, 60
    outline_thickness = 3 
    dots_size = 0.2 
    dots_spacing = 0.35
    dots_center = true
    outer_color = rgba(255, 255, 255, 0.37)
    inner_color = rgba(255, 255, 255, 0.17)
    font_color = rgb(255, 255, 255) 
    placeholder_text = <b> <i> Sneaky Boi </i> </b>
    fade_on_empty = true 
    hide_input = false
    position = 0, -120
    halign = center
    valign = center
  }
}
